<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="30 de zile">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Provocarea 30 de zile</title>
<style>
:root{
  --blue:#1e4fd8; --blue-d:#163ba3; --sky:#dbe7ff; --sky2:#eef3ff;
  --ink:#16181d; --mute:#6b7280; --line:#e6e8ee; --bg:#f6f7fb; --card:#fff;
  --good:#12a150; --bad:#e5484d; --warn:#f5a524;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative}
header.top{background:linear-gradient(160deg,var(--blue) 0%,#2c63f0 60%,#4b7cff 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;border-radius:0 0 28px 28px}
.top .row{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px;opacity:.95}
.pill{background:rgba(255,255,255,.18);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600}
.day{margin-top:18px;font-size:14px;opacity:.85;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.big{font-size:44px;font-weight:800;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.sub{font-size:14px;opacity:.85;margin-top:4px}
.prog{height:8px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:99px}
.wrap{padding:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.k{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;text-align:center}
.btn:active{transform:scale(.99);background:var(--blue-d)}
.btn.ghost{background:var(--sky2);color:var(--blue)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.streak{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.streak b{width:calc((100% - 29*4px)/30);min-width:7px;height:22px;border-radius:4px;background:var(--line)}
.streak b.on{background:var(--blue)}
.streak b.zero{background:var(--good)}
.streak b.today{outline:2px solid var(--ink);outline-offset:1px}
.chal{background:linear-gradient(135deg,#fff 0%,var(--sky2) 100%);border:1px solid var(--sky)}
.chal .t{font-size:18px;font-weight:800;margin:4px 0 6px}
.list .it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.it .n{flex:1;min-width:0}
.it .n b{display:block;font-size:15px}
.it .n span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.it .a{font-weight:800;font-variant-numeric:tabular-nums}
.list .it{cursor:pointer}
.it .del{background:var(--bad);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;flex:none}
#clsPill{touch-action:manipulation}
#dayLbl,#clsPill{user-select:none;-webkit-user-select:none;cursor:default}
.tag{font-size:11px;font-weight:800;color:var(--bad);background:#ffe9ea;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute);padding:4px 0}
nav.tabs button.on{color:var(--blue)}
nav.tabs .ico{display:block}
nav.tabs .add{width:58px;height:58px;border-radius:20px;background:var(--blue);color:#fff;font-size:32px;font-weight:400;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px rgba(30,79,216,.4)}
.sheet{position:fixed;inset:0;background:rgba(10,14,25,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .pane{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.amt{font-size:46px;font-weight:800;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.amt small{font-size:22px;color:var(--mute);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cat{padding:10px 6px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:700;text-align:center;border:2px solid transparent}
.cat .e{font-size:20px;display:block}
.cat.on{border-color:var(--blue);background:var(--sky2);color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pad button{padding:13px 0;border-radius:14px;background:var(--bg);font-size:22px;font-weight:700}
.pad button:active{background:var(--sky)}
.note{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:10px;font-size:15px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 14px;font-weight:600;font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--bad)}
.sw.on:after{left:23px}
.bars .b{margin:10px 0}
.bars .h{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.bars .tr{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:99px}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mute);font-weight:600}
.lb .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lb .r:first-of-type{border-top:0}
.lb .r,#lbTitle{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lb .r{transition:transform .15s;touch-action:manipulation}
.lb .sc{padding:6px 0 6px 18px}
.lb .sc input{width:58px;padding:2px 6px;font-weight:800;font-size:16px;color:var(--blue);text-align:right;border:1.5px solid var(--blue);border-radius:8px;user-select:text;-webkit-user-select:text}
.lb .r.drag{transition:none;position:relative;z-index:2;background:#fff;box-shadow:0 6px 18px rgba(16,24,40,.16)}
.lb .pos{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px}
.lb .r.me{background:var(--sky2);margin:0 -16px;padding:11px 16px}
.lb .r .nm{flex:1;font-weight:700}
.lb .r .sc{font-weight:800;color:var(--blue)}
.q{font-size:17px;font-weight:700;margin:6px 0 14px;line-height:1.35}
.qbox{background:var(--bg);border-radius:16px;padding:14px;font-size:15px;line-height:1.45;margin-bottom:14px;border-left:4px solid var(--blue)}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.45}
.fb.ok{background:#e7f8ee;color:#0b6b35}
.fb.no{background:#ffe9ea;color:#a01d22}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:8px;font-weight:600;background:#fff}
.opt.on{border-color:var(--blue);background:var(--sky2);color:var(--blue)}
.center{text-align:center}
.hero-ob{padding:calc(40px + env(safe-area-inset-top)) 24px 24px;background:linear-gradient(160deg,var(--blue),#4b7cff);color:#fff;border-radius:0 0 32px 32px}
.hero-ob h1{font-size:34px;line-height:1.08;margin:18px 0 10px}
.hero-ob p{opacity:.9;margin:0}
.muted{color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabs hide" id="tabs"><div class="in">
  <button data-tab="home" class="on"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Azi</button>
  <button data-tab="sum"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9h9"/><circle cx="12" cy="12" r="9"/></svg>Rezumat</button>
  <button id="addBtn" aria-label="Adaugă cheltuială"><span class="add">+</span></button>
  <button data-tab="chal"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Provocări</button>
  <button data-tab="lb"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Clase</button>
</div></nav>

<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script>
const CATS = [
  {id:'food', n:'Mâncare', e:'🍔', c:'#f59e0b'},
  {id:'out',  n:'Ieșiri',  e:'🎉', c:'#ec4899'},
  {id:'clothes', n:'Haine', e:'👕', c:'#8b5cf6'},
  {id:'games', n:'Jocuri și abonamente', short:'Jocuri', e:'🎮', c:'#1e4fd8'},
  {id:'transport', n:'Transport', e:'🚌', c:'#14b8a6'},
  {id:'other', n:'Altele', e:'📦', c:'#64748b'},
];
const CHAL = [
  {w:1, t:'Fotografia', d:'Doar notezi tot ce cheltui. Nu schimbi nimic. Vrem să vezi cum arată o săptămână normală.', goal:'Notează în 5 din 7 zile.'},
  {w:2, t:'Ziua zero', d:'Alege o zi din săptămâna asta în care nu cheltui niciun leu. Apasă „Azi n-am cheltuit nimic”.', goal:'O zi cu 0 lei.'},
  {w:3, t:'Vânătoarea', d:'Găsește un abonament, un joc sau un obicei pe care dai bani fără să-l folosești cu adevărat.', goal:'Marchează o cheltuială ca „regretată” și scrie de ce.'},
  {w:4, t:'Țeapa', d:'Cinci mesaje reale de pe telefon. Care e țeapă și care nu? Fără Google.', goal:'Joacă testul și ia 4 din 5.', quiz:true},
];
const QUIZ = [
  {m:'📦 „Felicitări! Coletul tău nu a putut fi livrat. Plătește 4,99 lei taxă de livrare aici: posta-ro-colet.info”', a:true, x:'Țeapă. Firmele de curierat nu cer plata prin linkuri din SMS, iar adresa nu e site-ul oficial. Scopul e să-ți ia datele cardului.'},
  {m:'📈 „Investește 500 de lei azi și primești 5.000 în 7 zile. Garantat! Doar 3 locuri rămase.”', a:true, x:'Țeapă. Randament garantat, foarte mare, foarte rapid și presiune de timp: sunt exact semnele unei scheme.'},
  {m:'🏦 „Depozit la termen, 12 luni, dobândă 6% pe an. Suma minimă 500 de lei.”', a:false, x:'Real. 6% pe an e o dobândă obișnuită la depozitele în lei. Câștig mic, dar sigur.'},
  {m:'🛒 Pe OLX: „Vreau produsul! Ți-am trimis banii, apasă pe link și introdu datele cardului ca să-i primești.”', a:true, x:'Țeapă. Ca să primești bani nu trebuie să introduci niciodată datele cardului. E una dintre cele mai frecvente țepe din România.'},
  {m:'🔐 „Banca ta nu îți va cere niciodată codul PIN sau parola prin telefon, SMS sau e-mail.”', a:false, x:'Real. Este un avertisment corect pe care îl trimit băncile. Dacă cineva îți cere PIN-ul, e țeapă.'},
];
const BASE_Q = [
  {k:'know', q:'Știi exact cât ai cheltuit luna trecută?', o:['Da, destul de exact','Aproximativ','Habar n-am']},
  {k:'save', q:'Pui bani deoparte în fiecare lună?', o:['Da, regulat','Uneori','Nu']},
  {k:'budget', q:'Ai un plan pentru banii tăi pe lună?', o:['Da','Mai mult în cap','Nu']},
];

const KEY = 'p30_v1';
let S = load();
let tab = 'home';
let draft = null, quizState = null, armed = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const lei = n => (Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.') + ' lei';
const dkey = d => d.toISOString().slice(0,10);
const today = () => { const d=new Date(); d.setHours(12,0,0,0); if(S&&S.off) d.setDate(d.getDate()+S.off); return d; };
function dayNum(){ if(!S) return 1; const s=new Date(S.start+'T12:00:00'); return Math.min(30, Math.max(1, Math.round((today()-s)/864e5)+1)); }
function dateOfDay(n){ const s=new Date(S.start+'T12:00:00'); s.setDate(s.getDate()+n-1); return dkey(s); }
function week(){ return Math.min(4, Math.ceil(dayNum()/7)); }
function catOf(id){ return CATS.find(c=>c.id===id) || CATS[5]; }
function isZero(dk){ if(S.ex.some(e=>e.d===dk)) return false; return S.zero.includes(dk) || (dk>=S.start && dk<dkey(today())); }
function loggedDays(){ const set=new Set(S.ex.map(e=>e.d)); S.zero.forEach(z=>set.add(z)); for(let i=1;i<dayNum();i++){ const dk=dateOfDay(i); if(isZero(dk)) set.add(dk); } return set; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),1800); }

function render(){
  const app = $('#app');
  if(!S || !S.onb){ $('#tabs').classList.add('hide'); app.innerHTML = onboarding(); bindOnb(); return; }
  $('#tabs').classList.remove('hide');
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  app.innerHTML = header() + '<div class="wrap">' + ({home, sum, chal, lb}[tab])() + '</div>';
  bindPage();
}

function header(){
  const n=dayNum(), days=loggedDays();
  const spent = S.ex.reduce((a,e)=>a+e.a,0);
  return `<header class="top">
    <div class="row"><div class="brand">PROVOCAREA 30 DE ZILE</div><div class="pill" id="clsPill">${S.cls}</div></div>
    <div class="day" id="dayLbl">Ziua ${n} din 30 · săptămâna ${week()}</div>
    <div class="big">${lei(spent)}</div>
    <div class="sub">cheltuiți până acum · ai notat în ${days.size} ${days.size===1?'zi':'zile'}</div>
    <div class="prog"><i style="width:${n/30*100}%"></i></div>
  </header>`;
}

function home(){
  const n=dayNum(), days=loggedDays(), t=dkey(today());
  const todayEx = S.ex.filter(e=>e.d===t);
  const todaySum = todayEx.reduce((a,e)=>a+e.a,0);
  const zeroToday = S.zero.includes(t);
  let cells=''; for(let i=1;i<=30;i++){ const dk=dateOfDay(i); const z=isZero(dk); cells+=`<b class="${z?'zero':(days.has(dk)?'on':'')} ${i===n?'today':''}"></b>`; }
  const c = CHAL[week()-1];
  const recent = [...S.ex].sort((a,b)=>b.ts-a.ts).slice(0,6);
  return `
  <div class="card">
    <div class="k">Seria ta</div>
    <div class="streak">${cells}</div>
    <div class="muted" style="margin-top:8px">Albastru: ai notat · Verde: zi fără cheltuieli</div>
  </div>
  <div class="card">
    <div class="row" style="display:flex;justify-content:space-between;align-items:baseline">
      <h3>Azi</h3><div style="font-weight:800;font-size:20px">${lei(todaySum)}</div>
    </div>
    ${todayEx.length||zeroToday ? '' : '<p class="muted" style="margin:0 0 12px">Încă n-ai notat nimic azi.</p>'}
    ${zeroToday && !todayEx.length ? '<p style="margin:0 0 12px;color:var(--good);font-weight:700">✓ Zi fără cheltuieli. Bravo!</p>' : ''}
    <div class="grid2">
      <button class="btn" data-act="add">+ Cheltuială</button>
      <button class="btn ghost" data-act="zero">Azi: 0 lei</button>
    </div>
  </div>
  <div class="card chal" data-go="chal">
    <div class="k">Provocarea săptămânii ${c.w}</div>
    <div class="t">${c.t}</div>
    <div class="muted">${c.goal}</div>
  </div>
  ${recent.length ? `<div class="card list"><h3>Ultimele cheltuieli</h3>${recent.map(item).join('')}</div>` : ''}
  `;
}

function item(e){
  const c=catOf(e.c); const d=new Date(e.d+'T12:00:00');
  const nday = Math.round((d-new Date(S.start+'T12:00:00'))/864e5)+1;
  return `<div class="it" data-it="${e.ts}"><div class="ic" style="background:${c.c}1f">${c.e}</div>
    <div class="n"><b>${c.short||c.n}${e.r?'<span class="tag">REGRET</span>':''}</b><span>Ziua ${nday}${e.note?' · '+esc(e.note):''}</span></div>
    ${armed===e.ts ? `<button class="del" data-del="${e.ts}">Șterge</button>` : `<div class="a">${lei(e.a)}</div>`}</div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function sum(){
  const total=S.ex.reduce((a,e)=>a+e.a,0);
  const by = CATS.map(c=>({c, v:S.ex.filter(e=>e.c===c.id).reduce((a,e)=>a+e.a,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const reg = S.ex.filter(e=>e.r).reduce((a,e)=>a+e.a,0);
  const days=loggedDays().size, n=dayNum();
  const perDay = n? total/n : 0;
  const top = by[0];
  const yearReg = reg/Math.max(n,1)*365;
  return `
  <div class="card">
    <h3>Unde îți pleacă banii</h3>
    ${by.length? `<div class="bars">${by.map(x=>`<div class="b"><div class="h"><span>${x.c.e} ${x.c.n}</span><span>${lei(x.v)} · ${Math.round(x.v/total*100)}%</span></div><div class="tr"><i style="width:${x.v/by[0].v*100}%;background:${x.c.c}"></i></div></div>`).join('')}</div>`
    : '<p class="muted">Notează câteva cheltuieli și aici apare harta banilor tăi.</p>'}
  </div>
  <div class="grid2" style="margin-bottom:14px">
    <div class="stat"><div class="v">${lei(perDay)}</div><div class="l">în medie pe zi</div></div>
    <div class="stat"><div class="v">${days}/${n}</div><div class="l">zile notate</div></div>
    <div class="stat"><div class="v" style="color:var(--bad)">${lei(reg)}</div><div class="l">pe lucruri regretate</div></div>
    <div class="stat"><div class="v">${lei(perDay*30)}</div><div class="l">ritmul tău pe lună</div></div>
  </div>
  ${reg>0 ? `<div class="card chal"><div class="k">Ce înseamnă asta</div><div class="t">${lei(yearReg)} pe an</div><div class="muted">Atât ai da pe un an pe lucruri pe care le regreți, dacă păstrezi ritmul de acum.</div></div>`:''}

const RIVALS = [{id:'r0',n:'a XI-a B',s:91},{id:'r1',n:'a X-a A',s:87},{id:'r2',n:'a IX-a C',s:74},{id:'r3',n:'a XII-a A',s:68},{id:'r4',n:'a X-a C',s:61}];
function ranking(mine){
  const all = [...RIVALS, {id:'me', n:S.cls, s:mine, me:true}].map(r=>({...r, s:S.scores?.[r.id] ?? r.s}));
  mine = all.find(r=>r.me).s;
  if(!S.order) return all.sort((a,b)=>b.s-a.s);
  const rows = S.order.map(id=>all.find(r=>r.id===id)), m = rows.findIndex(r=>r.me);
  const vals = all.filter(r=>!r.me).map(r=>r.s).sort((a,b)=>b-a);
  // rivals take the scores in order, kept above or below the user's real score
  let k=0;
  rows.forEach((r,i)=>{ if(r.me) return; const s=vals[k++];
    r.s = i<m ? Math.min(100, Math.max(s, mine+m-i)) : Math.max(0, Math.min(s, mine+m-i)); });
  return rows;
}
function editScore(el,id){
  const old=el.textContent; let done=false;
  el.innerHTML='<input inputmode="numeric" maxlength="3">';
  const inp=el.firstChild; inp.value=parseInt(old);
  inp.onpointerdown=inp.onclick=ev=>ev.stopPropagation();
  const finish=ok=>{
    if(done) return; done=true;
    const raw=inp.value.trim(), v=Math.min(100,parseInt(raw));
    if(ok && raw!==String(parseInt(old)) && (raw==='' || /^[0-9]+$/.test(raw))){
      const sc={...S.scores};
      ranking(Math.round(loggedDays().size/dayNum()*100)).forEach(r=>{ if(!r.me) sc[r.id]=r.s; });
      if(raw==='') delete sc[id]; else sc[id]=v;
      S.scores=sc; S.order=null; save();
    }
    render();
  };
  inp.onblur=()=>finish(true);
  inp.onkeydown=ev=>{ if(ev.key==='Enter') inp.blur(); if(ev.key==='Escape') finish(false); };
  inp.focus(); inp.select();
}
const SIM_EX = [['food','covrig',4,7],['food','sandviș',10,16],['food','shaorma',24,30],['food','automat',5,10],['transport','bilet autobuz',3,6],['out','bubble tea',12,18],['out','film la mall',28,38],['games','skin în joc',15,35],['clothes','tricou',35,60],['other','rechizite',6,15]];
const rnd = (a,b) => a+Math.floor(Math.random()*(b-a+1));
function simDay(){
  if(dayNum()>=30){ toast('Ești deja în ziua 30'); return; }
  const real = Math.round(loggedDays().size/dayNum()*100);
  const rows = ranking(real).map(r=>({...r}));
  if(!S.sim && S.scores?.me==null){
    const pos = S.order ? rows.findIndex(r=>r.me) : rows.length-1;
    const me = rows.splice(rows.findIndex(r=>r.me),1)[0];
    const vals = RIVALS.map(r=>S.scores?.[r.id] ?? r.s).sort((a,b)=>b-a);
    rows.forEach((r,i)=>r.s=vals[i]);
    me.s = pos<vals.length ? Math.min(99,vals[pos]+1) : Math.max(1,vals[pos-1]-6);
    rows.splice(pos,0,me);
  }
  if(!S.sim) S.sim={left:rnd(3,4)};
  S.off=(S.off||0)+1; armed=null;
  let m = rows.findIndex(r=>r.me);
  const me = rows[m];
  if(m>0 && S.sim.left<=1){
    const up=rows[m-1];
    me.s = Math.min(99, Math.max(me.s+1, up.s+1));
    up.s = Math.min(up.s, me.s-1);
    rows[m-1]=me; rows[m]=up; m--;
    S.sim.left=rnd(3,4);
  } else if(m>0){
    const gap=rows[m-1].s-me.s-1;
    me.s = Math.max(me.s, Math.min(98, me.s+Math.max(1, Math.round(gap/S.sim.left))));
    S.sim.left--;
  } else me.s = Math.min(99, me.s+(Math.random()<.6?1:0));
  rows.forEach((r,i)=>{ if(r.me) return; const v=r.s+rnd(-1,1);
    if(v<(i?rows[i-1].s:100) && v>(i<rows.length-1?rows[i+1].s:0)) r.s=v; });
  for(let i=m-1;i>=0;i--) rows[i].s=Math.min(100, Math.max(rows[i].s, rows[i+1].s+1));
  for(let i=m+1;i<rows.length;i++) rows[i].s=Math.max(0, Math.min(rows[i].s, rows[i-1].s-1));
  S.scores=Object.fromEntries(rows.map(r=>[r.id,r.s]));
  S.order=rows.map(r=>r.id);
  const d=dkey(today()), n=Math.random()<.2?0:rnd(1,2);
  if(!S.ex.some(e=>e.d===d)){
    let ts=Math.max(Date.now(), ...S.ex.map(e=>e.ts));
    for(let i=0;i<n;i++){ const [c,note,a,b]=SIM_EX[rnd(0,SIM_EX.length-1)];
      S.ex.push({a:rnd(a,b), c, note, r:(c==='games'||c==='out')&&Math.random()<.25, d, ts:++ts}); }
    if(!n && !S.zero.includes(d)) S.zero.push(d);
  }
  save(); render();
}

function cancelHold(){ if(hold) clearTimeout(hold.t); hold=null; }
function startDrag(el,y,id){
  hold=null; if(!el.isConnected) return;
  const els=[...document.querySelectorAll('[data-row]')], from=els.indexOf(el);
  drag={els, el, from, to:from, y, id, mid:els.map(r=>{const b=r.getBoundingClientRect(); return b.top+b.height/2;}), h:el.offsetHeight};
  el.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(15);
}
function endDrag(keep){
  cancelHold(); if(!drag) return;
  const {els,from,to}=drag; drag=null;
  if(keep && to!==from){ const o=els.map(r=>r.dataset.row); o.splice(to,0,o.splice(from,1)[0]); S.order=o; save(); }
  render();
}
document.addEventListener('pointermove', ev=>{
  if(hold && ev.pointerId===hold.id && Math.abs(ev.clientY-hold.y)>8) cancelHold();
  if(!drag || ev.pointerId!==drag.id) return;
  const {els,el,from,mid,h}=drag, c=mid[from]+ev.clientY-drag.y;
  el.style.transform=`translateY(${ev.clientY-drag.y}px)`;
  drag.to=mid.filter((m,i)=>i!==from && (i<from ? m<c : m<=c)).length;
  els.forEach((r,i)=>{ if(i===from) return;
    r.style.transform = i>from && i<=drag.to ? `translateY(${-h}px)` : i<from && i>=drag.to ? `translateY(${h}px)` : ''; });
});
document.addEventListener('pointerup', ev=>{ const p=drag||hold; if(p && ev.pointerId===p.id) endDrag(true); });
document.addEventListener('pointercancel', ev=>{ const p=drag||hold; if(p && ev.pointerId===p.id) endDrag(false); });
